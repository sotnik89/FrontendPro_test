<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>FrontendPro_test</title>
  <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
</head>
<body>
<label>
    I agree
    <input id="agreeCheckBox" type="checkbox">
</label>

<select id="citySelect">
    <option value="">Select a city</option>
    <option value="kyiv">Kyiv</option>
    <option value="kharkiv">Kharkiv</option>
    <option value="odessa">Odessa</option>
</select>

<div id="radioContainer">
    <label> Red
    <input type="radio" name="color" value="red">
    </label>
    <label> Blue
        <input type="radio" name="color" value="blue">
    </label>
</div>

<form id="loginForm" novalidate>  <!--// action="http://www.facebook.com/email-submit" method="post"-->
    <div class="row">
        <label>Email:
            <input id="emailInput" type="email" name="email" required>
        </label>
    </div>
    <div class="row">
        <label>Password:
            <input id="passInput" type="password" name="password" required minlength="6" maxlength="20">
        </label>
    </div>
    <div class="row">
        <button type="submit" id="submitButton">Login</button>
        <button type="button" id="clearButton">Clear</button>
    </div>
</form>


<form id="formWithData">
    <div class="row">
        <label>User Name:
            <input type="text" name="username" placeholder="Username" required>
        </label>
    </div>
    <div class="row">
        <label>Email:
            <input type="email" name="email" placeholder="Email" required>
        </label>
    </div>
    <div class="row">
        <label>
            HTML
            <input name="skills" type="checkbox" value="html">
        </label>
        <label>
            Javascript
            <input name="skills" type="checkbox" value="js">
        </label>
    </div>
    <button type="submit">Send</button>
    <div id="result"></div>
</form>
</body>
</html>

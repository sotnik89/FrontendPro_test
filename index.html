<html lang="en">
<head>
    <meta charset="UTF-8">

          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">

<body>
<h1>We would like to help you</h1>
<form id="formLogin">
    <label> Name
        <input id="nameInput" type="text" placeholder="Name" required>
    </label>
    <textarea id="messageText" placeholder="Message" minlength="5">
    </textarea>
    <h2>How to answer to you</h2>
<input id="phone" type="tel" placeholder="Phone number +380">
    <input id="email" type="email" placeholder="Email" required pattern="@/.">
    <button id="btn">Send message</button>
</form>

</body>

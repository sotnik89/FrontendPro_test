<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>FrontendPro_test</title>
  <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js"defer></script>
</head>
<body>
<h1>We would like to help you</h1>
<form id="formLogin" novalidate>
    <div class="field">
        <label> Name
            <input id="nameInput" name="name" type="text" placeholder="Name" required>
        </label>
    </div>
    <div class="field">
    <textarea id="messageText" name="message" placeholder="Message"  minlength="5">
    </textarea>
    </div>
    <h2>How to answer to you</h2>
    <div class="field">
        <input id="phone" name="phone" type="tel" placeholder="Phone number +380">
        <span id="errorPhone" class="error">Please enter correct phone number</span>
    </div>
    <div class="field">
        <input id="email" type="email" name="email" placeholder="Email" required>
        <span id="errorEmail" class="error">Please enter correct email</span>
    </div>
    <button id="btn">Send message</button>
</form>

</body>
</html>
